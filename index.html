<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G26 Planner · Programação de Redes Elétricas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark">G2</div>
      <div><h1>G26 Planner</h1><span>Programação &amp; Manutenção</span></div>
    </div>
    <div class="login-sub">Acesso restrito — informe suas credenciais.</div>
    <div class="login-status" id="login-status">Conectando ao banco de dados…</div>
    <div class="field"><label>Usuário</label><input id="login-user" autocomplete="username" placeholder="ex.: 1"></div>
    <div class="field"><label>Senha</label><input id="login-pass" type="password" autocomplete="current-password" placeholder="••••••"></div>
    <button class="btn btn-primary btn-block" id="login-btn">Entrar</button>
  </div>
</div>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">G2</div>
      <div class="brand-text"><h1>G26 Planner</h1><span>Programação &amp; Manutenção</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="nav-foot">
      <button id="btn-backup">⇅ Exportar / Importar dados</button>
      <button id="btn-logout">Sair (trocar usuário)</button>
      <div class="hint" id="nav-user">Dados sincronizados na nuvem (Firebase)</div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn btn-ghost mobile-toggle" id="mobile-toggle">☰</button>
        <div><h2 id="page-title">Painel</h2><div class="sub" id="page-sub">Visão geral do sistema</div></div>
      </div>
      <div id="topbar-actions"></div>
    </div>
    <div id="banner-area"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="modal-root"></div>
<div class="toast-wrap" id="toast-wrap"></div>
<input type="file" id="import-file" accept="application/json" style="display:none">
<div id="print-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
